<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingeniería Geológica · UNAL Medellín</title>
  <meta name="description" content="Programa de Ingeniería Geológica de la Facultad de Minas, Universidad Nacional de Colombia, Sede Medellín: información del programa, malla curricular, perfil del egresado, grupos de investigación y vida estudiantil.">
  <link rel="icon" type="image/jpeg" href="img/logo-geologia.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/inicio.css">
</head>
<body data-pagina="inicio">

  <div id="barra"></div>

  <!-- PORTADA -->
  <section class="portada foto foto--inicio">
    <div class="contenedor portada__contenido">
      <div class="portada__logo-wrap">
        <img class="portada__logo" src="img/logo-geologia.jpg" alt="Logo oficial de Ingeniería Geológica · Facultad de Minas" width="125" height="125">
      </div>
      <p class="portada__lugar">Facultad de Minas · Universidad Nacional de Colombia · Sede Medellín</p>

      <h1 class="portada__titulo">
        <span class="portada__antetitulo">Ingeniería</span>
        <span class="letras-varsity" data-texto="Geológica">Geológica</span>
      </h1>

      <ul class="portada__cifras" id="portada-cifras" aria-label="Datos clave del programa"></ul>

      <div class="portada__geobadge" aria-label="Tradición y localización geológica">
        <span class="portada__geobadge-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          Hidrosogamoso · Embalse Topocoro · Santander
        </span>
        <span class="portada__geobadge-sep" aria-hidden="true">·</span>
        <span class="portada__geobadge-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          Área Curricular de Recursos Minerales
        </span>
        <span class="portada__geobadge-sep" aria-hidden="true">·</span>
        <span class="portada__geobadge-item">Escuela de Minas · Desde 1911</span>
      </div>
    </div>
  </section>

  <main>

    <!-- EL PROGRAMA: se carga al abrir la página -->
    <section class="seccion programa" id="programa" aria-labelledby="programa-titulo">
      <div class="contenedor" id="programa-contenido">
        <p class="cargando">Cargando programa…</p>
      </div>
    </section>

    <!-- PERFIL DEL EGRESADO: se carga cuando la persona se acerca -->
    <section class="seccion perfil" id="perfil" aria-labelledby="perfil-titulo" data-carga="perfil">
      <div class="contenedor" id="perfil-contenido">
        <p class="cargando">Cargando perfil…</p>
      </div>
    </section>

    <!-- GRUPOS Y SEMILLEROS: se carga cuando la persona se acerca -->
    <section class="grupos" id="grupos" aria-labelledby="grupos-titulo" data-carga="grupos">
      <div class="contenedor" id="grupos-contenido">
        <p class="cargando">Cargando grupos…</p>
      </div>
    </section>

  </main>

  <div id="pie"></div>

  <script src="js/comun.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
